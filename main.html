
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Insurance Registration Form</title>
</head>
<body>

    <h1>Car Insurance Registration Form</h1>

    <form action="#" method="post">

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <p>Gender</p>

        <input type="radio" id="gender_m" name="gender"
               value="male" required>
        <label for="gender_m">Male</label>

        <input type="radio" id="gender_f" name="gender"
               value="female">
        <label for="gender_f">Female</label>

        <br><br>

        <label for="cars">Car Brands</label>
        <select id="cars" name="cars">
            <option value="">--Please choose an option--</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Mercedes">Mercedes</option>
        </select>

        <br><br>

        <label for="carage">Car Age</label>
        <input type="number" id="carage" name="carage" required>
        <br><br>

        <label for="dop">Date of Purchase (dop)</label>
        <input type="date" id="dop" name="dop" required>
        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
